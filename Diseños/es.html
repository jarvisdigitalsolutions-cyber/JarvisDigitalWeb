<!-- SECCIÓN GTA VI - PANTALLA COMPLETA CINEMÁTICA -->
<section class="gta-cinematic" id="gta-cinematic">
  <div class="gta-bg"></div>
  <div class="gta-light"></div>
  <div class="gta-content">
    <div class="gta-badge">Próximo Gran Estreno</div>
    <h1 class="gta-title">Grand Theft Auto VI</h1>
    <p class="gta-subtitle">Vuelve a Vice City. Reserva ya tu copia.</p>

    <div class="gta-countdown" id="gta-countdown">
      <div class="gta-countdown-item">
        <span class="gta-countdown-number" id="gta-days">00</span>
        <span class="gta-countdown-label">Días</span>
      </div>
      <div class="gta-countdown-item">
        <span class="gta-countdown-number" id="gta-hours">00</span>
        <span class="gta-countdown-label">Horas</span>
      </div>
      <div class="gta-countdown-item">
        <span class="gta-countdown-number" id="gta-minutes">00</span>
        <span class="gta-countdown-label">Minutos</span>
      </div>
      <div class="gta-countdown-item">
        <span class="gta-countdown-number" id="gta-seconds">00</span>
        <span class="gta-countdown-label">Segundos</span>
      </div>
    </div>

    <a href="#" class="gta-cta" onclick="alert('Reserva confirmada en tienda. ¡Gracias!'); return false;">Reservar Ahora</a>
    <p class="gta-footer-note">Formato físico · Recogida en tienda el día de lanzamiento</p>
  </div>
</section>

<style>
  /* Reset local para asegurar pantalla completa */
  .gta-cinematic, .gta-cinematic * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  .gta-cinematic {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    opacity: 0;
    transform: scale(0.92);
    filter: blur(12px);
    transition: opacity 1.8s cubic-bezier(0.23, 1, 0.32, 1), 
                transform 1.8s cubic-bezier(0.23, 1, 0.32, 1),
                filter 1.6s cubic-bezier(0.23, 1, 0.32, 1);
    will-change: transform, opacity, filter;
    background: #000; /* fallback */
    font-family: 'Montserrat', sans-serif;
  }

  .gta-cinematic.revealed {
    opacity: 1;
    transform: scale(1);
    filter: blur(0);
  }

  .gta-bg {
    position: absolute;
    inset: 0;
    background-image: url('../Sony-Web/IMG/PS5/Banner/Grand-theft-auto-VI.webp');
    background-size: cover;
    background-position: center;
    z-index: 0;
    filter: brightness(0.35) saturate(1.3);
  }

  /* Iluminación ambiental que sigue al ratón */
  .gta-light {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 50%, rgba(255, 42, 109, 0.35) 0%, transparent 70%);
    z-index: 1;
    pointer-events: none;
    transition: background 0.2s ease;
  }

  .gta-content {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    text-align: center;
    color: #fff;
    padding: 2rem;
  }

  .gta-badge {
    display: inline-block;
    background: rgba(255, 42, 109, 0.9);
    backdrop-filter: blur(15px);
    padding: 0.6rem 2rem;
    border-radius: 9999px;
    font-size: 1rem;
    font-weight: 500;
    margin-bottom: 1.8rem;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    box-shadow: 0 0 40px rgba(255, 42, 109, 0.7);
    border: 1px solid rgba(255,255,255,0.2);
  }

  .gta-title {
    font-size: clamp(3.5rem, 12vw, 8rem);
    font-weight: 300;
    line-height: 1;
    margin-bottom: 1rem;
    background: linear-gradient(135deg, #FF2A6D 0%, #FF8C42 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 30px rgba(255, 42, 109, 0.4));
    letter-spacing: -1px;
  }

  .gta-subtitle {
    font-size: 1.5rem;
    font-weight: 300;
    opacity: 0.9;
    margin-bottom: 3rem;
    letter-spacing: 1px;
    color: rgba(255,255,255,0.9);
  }

  .gta-countdown {
    display: flex;
    justify-content: center;
    gap: 2rem;
    margin-bottom: 3rem;
    flex-wrap: wrap;
  }

  .gta-countdown-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 100px;
  }

  .gta-countdown-number {
    font-size: 4.5rem;
    font-weight: 300;
    line-height: 1;
    background: rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 42, 109, 0.5);
    border-radius: 28px;
    padding: 1.2rem 1.8rem;
    min-width: 110px;
    text-align: center;
    box-shadow: 0 0 60px rgba(255, 42, 109, 0.4), inset 0 0 20px rgba(255, 140, 66, 0.3);
    letter-spacing: 3px;
    font-variant-numeric: tabular-nums;
  }

  .gta-countdown-label {
    font-size: 0.9rem;
    text-transform: uppercase;
    letter-spacing: 3px;
    margin-top: 1rem;
    opacity: 0.8;
    font-weight: 400;
  }

  .gta-cta {
    display: inline-block;
    padding: 1.3rem 4rem;
    border-radius: 9999px;
    background: linear-gradient(135deg, #FF2A6D, #FF8C42);
    color: white;
    font-size: 1.2rem;
    font-weight: 500;
    letter-spacing: 1.5px;
    text-decoration: none;
    transition: all 0.3s ease;
    box-shadow: 0 0 60px rgba(255, 42, 109, 0.8);
    border: none;
    cursor: pointer;
    margin-top: 1rem;
    text-transform: uppercase;
  }

  .gta-cta:hover {
    box-shadow: 0 0 90px rgba(255, 80, 100, 1);
    transform: translateY(-4px);
    background: linear-gradient(135deg, #FF3A7D, #FF9C52);
  }

  .gta-footer-note {
    margin-top: 2.5rem;
    font-size: 0.9rem;
    opacity: 0.65;
    font-weight: 300;
    letter-spacing: 0.5px;
  }

  @media (max-width: 768px) {
    .gta-countdown-number {
      font-size: 3rem;
      padding: 1rem 1.2rem;
      min-width: 80px;
    }
    .gta-countdown {
      gap: 1rem;
    }
    .gta-title {
      font-size: 3rem;
    }
  }
</style>

<script>
  (function() {
    // Cuenta regresiva
    const launchDate = new Date('2026-10-24T00:00:00').getTime();

    function updateCountdown() {
      const now = Date.now();
      const distance = launchDate - now;

      if (distance < 0) {
        ['days', 'hours', 'minutes', 'seconds'].forEach(id => {
          document.getElementById('gta-' + id).textContent = '00';
        });
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      document.getElementById('gta-days').textContent = String(days).padStart(2, '0');
      document.getElementById('gta-hours').textContent = String(hours).padStart(2, '0');
      document.getElementById('gta-minutes').textContent = String(minutes).padStart(2, '0');
      document.getElementById('gta-seconds').textContent = String(seconds).padStart(2, '0');
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();

    // Revelación cinemática con Intersection Observer
    const section = document.getElementById('gta-cinematic');
    if (!section) return;

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('revealed');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.25 });

    observer.observe(section);

    // Iluminación dinámica que sigue al ratón
    const light = document.querySelector('.gta-light');
    if (!light) return;

    document.addEventListener('mousemove', (e) => {
      if (!section.classList.contains('revealed')) return; // solo activo cuando es visible
      const rect = section.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const percentX = (x / rect.width) * 100;
      const percentY = (y / rect.height) * 100;
      light.style.background = `radial-gradient(circle at ${percentX}% ${percentY}%, rgba(255, 42, 109, 0.45) 0%, transparent 70%)`;
    });
  })();
</script>
