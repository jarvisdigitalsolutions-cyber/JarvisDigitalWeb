<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>PS5 PRO · Colección Profesional</title>
    <style>
        :root {
            --bg-dark: #0a0a0f;
            --bg-surface: #151520;
            --accent-1: #2563EB; /* Primary blue */
            --accent-2: #A855F7; /* Purple */
            --accent-3: #06B6D4; /* Cyan */
            --accent: var(--accent-1);
            --accent-light: #60A5FA;
            --accent-glow: #1E40AF;
            --text: #e8e8f0;
            --text-muted: #a0a0b0;
            --text-light: #7a7a8a;
            --shadow-card: 0 12px 40px rgba(37, 99, 235, 0.15);
            --radius: 20px;
            --transition: 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1030 50%, #0f1020 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2.5rem 1rem 4rem;
            position: relative;
            overflow-x: hidden;
        }

        /* Fondo PS5 dinámico con luz */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            right: -20%;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.12) 0%, transparent 70%);
            border-radius: 50%;
            animation: float 15s ease-in-out infinite;
            z-index: 0;
            pointer-events: none;
            filter: blur(40px);
            -webkit-filter: blur(40px);
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -30%;
            left: -15%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.10) 0%, transparent 70%);
            border-radius: 50%;
            animation: float 20s ease-in-out infinite reverse;
            z-index: 0;
            pointer-events: none;
            filter: blur(50px);
            -webkit-filter: blur(50px);
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(30px, -30px); }
            50% { transform: translate(0, 40px); }
            75% { transform: translate(-30px, -20px); }
        }

        .content-wrapper {
            position: relative;
            z-index: 2;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Particle background canvas */
        #bg-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            display: block;
            mix-blend-mode: screen;
        }

        /* Celebration banner */
        .celebration {
            position: fixed;
            top: 2rem;
            right: 2rem;
            z-index: 3500;
            background: linear-gradient(90deg, var(--accent-2), var(--accent-1));
            color: white;
            padding: 0.8rem 1rem;
            border-radius: 14px;
            font-weight: 800;
            box-shadow: 0 12px 40px rgba(2,6,23,0.6);
            transform: translateY(-10px) scale(0.98);
            opacity: 0;
            transition: opacity 360ms ease, transform 360ms cubic-bezier(.2,.9,.3,1);
            display: inline-flex;
            gap: 0.6rem;
            align-items: center;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            padding-left: 1rem;
        }

        .celebration.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* Card roundness, spacing and grid gap */
        .games-grid { gap: 3rem; }
        .game-card {
            border-radius: 36px;
            max-width: 320px;
            padding-bottom: 1rem;
        }

        .game-cover {
            border-radius: 18px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.55), 0 0 30px rgba(37,99,235,0.06);
        }

        .game-info { padding: 1.8rem 1.4rem; }

        /* Modal: pop and slightly higher position */
        .modal-details {
            transform: translateY(-6vh) scale(1);
            transition: transform 320ms cubic-bezier(.2,.9,.3,1), opacity 220ms ease;
        }

        .modal-overlay.active .modal-details {
            transform: translateY(0) scale(1.00);
        }

        @keyframes modalPop {
            from { transform: translateY(-12px) scale(0.98); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }

        .modal-overlay.active .modal-details { animation: modalPop 380ms cubic-bezier(.2,.9,.3,1); }

        /* ===== HEADER PROFESIONAL ===== */
        .ps5-header {
            width: 100%;
            max-width: 1400px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 3rem;
            flex-wrap: wrap;
            gap: 2rem;
            padding: 2rem;
            background: rgba(21, 21, 32, 0.4);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 164, 255, 0.1);
            border-radius: var(--radius);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            animation: slideDown 0.6s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .ps5-symbol {
            background: linear-gradient(135deg, var(--accent-glow) 0%, var(--accent) 100%);
            width: 60px;
            height: 60px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 2rem;
            color: white;
            box-shadow: 0 0 30px rgba(0, 164, 255, 0.6), inset 0 0 20px rgba(255, 255, 255, 0.1);
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 30px rgba(0, 164, 255, 0.6), inset 0 0 20px rgba(255, 255, 255, 0.1); }
            50% { box-shadow: 0 0 50px rgba(0, 164, 255, 0.9), inset 0 0 30px rgba(255, 255, 255, 0.2); }
        }

        .page-title h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.8px;
            background: linear-gradient(to right, #ffffff 0%, var(--accent-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .page-title span {
            font-size: 0.95rem;
            color: var(--text-muted);
            display: block;
            font-weight: 400;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 0.3rem;
        }

        .stats-badge {
            background: rgba(0, 164, 255, 0.08);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 164, 255, 0.2);
            border-radius: 50px;
            padding: 0.8rem 1.8rem;
            font-size: 1rem;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-weight: 500;
        }

        .stats-badge strong {
            color: var(--accent-light);
            font-size: 1.3rem;
            font-weight: 700;
        }

        .stats-badge i {
            font-size: 1.2rem;
            color: var(--accent-1);
        }

        /* Background controls (preset selector + intensity + auto) */
        .bg-controls {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .bg-controls label { display:flex; align-items:center; gap:0.6rem; color:var(--text-muted); font-weight:700; }

        .bg-controls select, .bg-controls input[type="range"] {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.04);
            color: var(--text);
            padding: 0.45rem 0.6rem;
            border-radius: 12px;
            height: 40px;
        }

        .bg-controls input[type="range"] {
            width: 140px;
            -webkit-appearance: none;
            appearance: none;
            height: 6px;
            background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
            border-radius: 999px;
            outline: none;
        }

        .bg-controls input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px; height: 16px; border-radius: 50%;
            background: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            border: 3px solid var(--accent-1);
        }

        .bg-auto {
            display:inline-flex;
            align-items:center;
            gap:0.5rem;
            border-radius:12px;
            padding:0.45rem 0.8rem;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.04);
            color: var(--text);
            cursor: pointer;
            height:40px;
            font-weight:700;
        }

        .bg-auto.active { background: linear-gradient(90deg, var(--accent-2), var(--accent)); color: white; box-shadow: 0 8px 30px rgba(0,164,255,0.12); }

        /* Icon spacing for buttons and badges */
        .btn-detail i,
        .btn-cola i,
        .modal-btn i,
        .descarga-btn i,
        .quitar-cola-btn i,
        .stats-badge i,
        .platform-badge i,
        .peso-badge i,
        .cola-meta i,
        .toast-icon {
            margin-right: 0.6rem;
            vertical-align: middle;
        }

        /* ===== PESTAÑAS ===== */
        .tabs {
            width: 100%;
            max-width: 1400px;
            display: flex;
            gap: 1rem;
            margin-bottom: 3rem;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(0, 164, 255, 0.1);
            color: var(--text-muted);
            padding: 0.8rem 2rem;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            gap: 0.6rem;
            backdrop-filter: blur(8px);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--accent-glow), var(--accent));
            border-color: var(--accent);
            color: white;
            box-shadow: 0 0 30px rgba(0, 164, 255, 0.5);
            transform: translateY(-2px);
        }

        .tab-btn:hover:not(.active) {
            background: rgba(0, 164, 255, 0.1);
            border-color: rgba(0, 164, 255, 0.3);
            color: var(--accent-light);
        }

        .cola-badge {
            background: #ff4d6a;
            color: white;
            font-size: 0.75rem;
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            font-weight: 700;
        }

        /* ===== CONTENEDOR VISTAS ===== */
        .view-container {
            width: 100%;
            max-width: 1400px;
        }

        .view {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .view.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* ===== GRID PROFESIONAL DE JUEGOS ===== */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2.5rem;
            justify-items: center;
            padding: 0 1rem;
        }

        .game-card {
            background: linear-gradient(135deg, rgba(21, 21, 32, 0.5), rgba(30, 20, 60, 0.3));
            border-radius: 24px;
            overflow: hidden;
            width: 100%;
            max-width: 300px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.4), inset 0 0 0 1px rgba(0, 164, 255, 0.1);
            transition: all var(--transition);
            border: 1px solid rgba(0, 164, 255, 0.15);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: visible;
        }

        .game-card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(135deg, rgba(0, 164, 255, 0), rgba(0, 164, 255, 0.2), rgba(0, 164, 255, 0));
            border-radius: 24px;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: -1;
        }

        .game-card:hover::before {
            opacity: 1;
        }

        .game-card:hover {
            transform: translateY(-12px);
            box-shadow: 0 20px 60px rgba(0, 164, 255, 0.25), inset 0 0 0 1px rgba(0, 164, 255, 0.3);
        }

        .game-cover {
            width: 100%;
            aspect-ratio: 3/4;
            object-fit: cover;
            background: linear-gradient(135deg, #1a1030, #0f1020);
            transition: all 0.4s;
            cursor: pointer;
        }

        .game-card:hover .game-cover {
            opacity: 0.85;
            transform: scale(1.02);
        }

        .game-cover-fallback {
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1030, #0f1020);
            color: var(--text-light);
            font-size: 3rem;
            aspect-ratio: 3/4;
        }

        .game-info {
            padding: 1.3rem 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            flex-grow: 1;
        }

        .game-title {
            font-weight: 700;
            font-size: 1.1rem;
            line-height: 1.3;
            letter-spacing: -0.3px;
            color: var(--text);
        }

        .game-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .platform-badge {
            display: inline-flex;
            align-items: center;
            background: linear-gradient(135deg, rgba(0, 164, 255, 0.2), rgba(0, 164, 255, 0.1));
            border: 1px solid rgba(0, 164, 255, 0.3);
            color: var(--accent-light);
            font-size: 0.7rem;
            font-weight: 700;
            padding: 0.35rem 0.8rem;
            border-radius: 16px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .peso-badge {
            display: inline-flex;
            align-items: center;
            background: rgba(138, 43, 226, 0.1);
            border: 1px solid rgba(138, 43, 226, 0.2);
            color: #b794f6;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 0.35rem 0.8rem;
            border-radius: 16px;
        }

        .card-buttons {
            display: flex;
            gap: 0.6rem;
            margin-top: auto;
        }

        .btn-detail {
            background: rgba(0, 164, 255, 0.1);
            border: 1px solid rgba(0, 164, 255, 0.3);
            color: var(--accent-light);
            font-weight: 600;
            font-size: 0.85rem;
            padding: 0.65rem 1rem;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.35rem;
            transition: all var(--transition);
            cursor: pointer;
            flex: 1;
            backdrop-filter: blur(4px);
        }

        .btn-detail:hover {
            background: rgba(0, 164, 255, 0.2);
            border-color: rgba(0, 164, 255, 0.5);
            box-shadow: 0 0 20px rgba(0, 164, 255, 0.4);
            transform: translateY(-2px);
        }

        .btn-cola {
            background: rgba(255, 77, 106, 0.1);
            border: 1px solid rgba(255, 77, 106, 0.3);
            color: #ff6b81;
            font-weight: 600;
            font-size: 0.85rem;
            padding: 0.65rem 1rem;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.35rem;
            transition: all var(--transition);
            cursor: pointer;
            flex: 1;
            backdrop-filter: blur(4px);
        }

        .btn-cola:hover {
            background: rgba(255, 77, 106, 0.2);
            border-color: rgba(255, 77, 106, 0.5);
            box-shadow: 0 0 20px rgba(255, 77, 106, 0.4);
            transform: translateY(-2px);
        }

        .btn-cola.in-cola {
            background: rgba(46, 125, 50, 0.2);
            border-color: rgba(76, 175, 80, 0.5);
            color: #76c043;
            cursor: not-allowed;
        }

        .btn-cola.in-cola:hover {
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.3);
        }

        /* ===== COLA DE DESCARGA ===== */
        .cola-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .cola-empty {
            text-align: center;
            padding: 5rem 2rem;
            color: var(--text-light);
            font-size: 1.1rem;
            background: linear-gradient(135deg, rgba(0, 164, 255, 0.05), rgba(138, 43, 226, 0.05));
            border-radius: var(--radius);
            border: 2px dashed rgba(0, 164, 255, 0.15);
        }

        .cola-item {
            background: linear-gradient(135deg, rgba(21, 21, 32, 0.5), rgba(30, 20, 60, 0.3));
            border: 1px solid rgba(0, 164, 255, 0.1);
            border-radius: 16px;
            padding: 1.3rem;
            display: flex;
            align-items: center;
            gap: 1.5rem;
            transition: all 0.25s;
            flex-wrap: wrap;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .cola-item:hover {
            border-color: rgba(0, 164, 255, 0.3);
            box-shadow: 0 8px 30px rgba(0, 164, 255, 0.15);
        }

        .cola-cover {
            width: 70px;
            height: 95px;
            border-radius: 10px;
            object-fit: cover;
            background: linear-gradient(135deg, #1a1030, #0f1020);
            flex-shrink: 0;
            border: 1px solid rgba(0, 164, 255, 0.2);
        }

        .cola-info {
            flex: 1;
            min-width: 200px;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .cola-info h3 {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text);
        }

        .cola-meta {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .cola-meta span {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .descarga-btn {
            background: linear-gradient(135deg, var(--accent-glow), var(--accent));
            border: none;
            color: white;
            font-weight: 700;
            padding: 0.7rem 1.6rem;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.25s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            white-space: nowrap;
            box-shadow: 0 0 20px rgba(0, 164, 255, 0.4);
        }

        .descarga-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(0, 164, 255, 0.6);
        }

        .descarga-btn.sin-enlace {
            background: rgba(255, 77, 106, 0.2);
            border: 1px solid rgba(255, 77, 106, 0.3);
            color: #ff6b81;
            cursor: not-allowed;
            box-shadow: none;
        }

        .quitar-cola-btn {
            background: rgba(255, 77, 106, 0.1);
            border: 1px solid rgba(255, 77, 106, 0.3);
            color: #ff6b81;
            padding: 0.6rem 1rem;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
            white-space: nowrap;
            font-weight: 600;
        }

        .quitar-cola-btn:hover {
            background: rgba(255, 77, 106, 0.2);
            border-color: rgba(255, 77, 106, 0.5);
            color: #ff8d9e;
        }

        .cola-actions-top {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 1.5rem;
        }

        .clear-cola-btn {
            background: rgba(255, 77, 106, 0.1);
            border: 1px solid rgba(255, 77, 106, 0.3);
            color: #ff6b81;
            padding: 0.7rem 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .clear-cola-btn:hover {
            background: rgba(255, 77, 106, 0.2);
            border-color: rgba(255, 77, 106, 0.5);
            color: #ff8d9e;
        }

        /* ===== MODALES PROFESIONALES ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(15px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 1rem;
        }

        .modal-overlay.active {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        .modal-details {
            background: linear-gradient(135deg, rgba(21, 21, 32, 0.9), rgba(30, 20, 60, 0.7));
            border: 1px solid rgba(0, 164, 255, 0.2);
            border-radius: 28px;
            width: 100%;
            max-width: 900px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            display: grid;
            grid-template-columns: 200px 1fr;
            gap: 2rem;
            padding: 2rem;
            border-bottom: 1px solid rgba(0, 164, 255, 0.08);
            align-items: flex-start;
            position: relative;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            background: linear-gradient(90deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
        }

        .modal-poster {
            width: 100%;
            aspect-ratio: 3/4;
            border-radius: 16px;
            object-fit: cover;
            border: 2px solid rgba(0, 164, 255, 0.3);
            box-shadow: 0 0 30px rgba(0, 164, 255, 0.2);
        }

        .modal-info {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .modal-title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text);
            line-height: 1.2;
        }

        .modal-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
        }

        .modal-title {

            text-transform: uppercase;

        .detail-content {
            color: var(--text-muted);

            font-size: 0.95rem;
        }

        .modal-actions {
            display: flex;
            gap: 1rem;
            padding: 2rem;
            border-top: 1px solid rgba(0, 164, 255, 0.1);
            flex-wrap: wrap;
        }

            flex: 1;

            padding: 1rem 1.5rem;
            border-radius: 12px;
            border: none;
            font-weight: 700;
            font-size: 0.95rem;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .modal-btn-primary {
            background: linear-gradient(135deg, var(--accent-glow), var(--accent));
            color: white;
            box-shadow: 0 0 20px rgba(0, 164, 255, 0.4);
        }

        .modal-btn-primary:hover {
            box-shadow: 0 0 30px rgba(0, 164, 255, 0.6);
            transform: scale(1.02);
        }

        .modal-btn-secondary {
            background: rgba(255, 77, 106, 0.1);
            border: 1px solid rgba(255, 77, 106, 0.3);
            color: #ff6b81;
        }

        .modal-btn-secondary:hover {
            background: rgba(255, 77, 106, 0.2);
            border-color: rgba(255, 77, 106, 0.5);
        }

        .close-btn {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            background: rgba(255, 77, 106, 0.1);
            border: 1px solid rgba(255, 77, 106, 0.3);
            color: #ff6b81;
            font-size: 1.8rem;
            cursor: pointer;
            transition: all 0.2s;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
        }

        .close-btn:hover {
            background: rgba(255, 77, 106, 0.2);
            border-color: rgba(255, 77, 106, 0.5);
            transform: scale(1.1);
        }

        /* Modal Trailer */
        .modal-trailer {

            position: relative;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9);
            overflow: hidden;

            width: 100%;
            height: 100%;
            border-radius: 28px;
            border: none;
        }

        /* ===== TOAST NOTIFICACIONES ===== */
        .toast {
            position: fixed;
            bottom: 2.5rem;
            left: 50%;
            transform: translateX(-50%) translateY(12px);
            z-index: 1999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 260ms ease, transform 260ms cubic-bezier(.2,.9,.3,1);
            width: auto;
            max-width: 720px;
            padding: 0;
            border-radius: 14px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 12px 40px rgba(2,6,23,0.6);
            border: 1px solid rgba(255,255,255,0.04);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }

        .toast-inner {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.9rem 1rem;
            color: var(--text);
        }

        .toast .toast-icon {
            font-size: 1.15rem;
            width: 32px;
            height: 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
        }

        .toast.success .toast-icon { color: white; background: linear-gradient(90deg, var(--accent-3), var(--accent-1)); }
        .toast.info .toast-icon { color: white; background: linear-gradient(90deg, var(--accent-1), var(--accent-2)); }
        .toast.warn .toast-icon { color: white; background: linear-gradient(90deg, var(--accent-2), var(--accent-3)); }

        .toast-message { font-weight: 700; font-size: 0.95rem; color: var(--text); }

        .toast-action { margin-left: auto; background: transparent; border: none; color: var(--accent-light); font-weight: 700; cursor: pointer; }

        .toast-progress {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
            width: 0%;
            border-bottom-left-radius: 14px;
            border-bottom-right-radius: 14px;
            transition: width 0.2s linear;
        }

        /* ===== FOOTER PROFESIONAL ===== */
        footer {
            margin-top: 5rem;
            padding-top: 3rem;
            border-top: 1px solid rgba(0, 164, 255, 0.1);
            color: var(--text-light);
            font-size: 0.85rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
        }

        .footer-text {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .footer-signature {
            font-weight: 600;
            color: var(--accent-light);
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        .footer-copyright {
            font-size: 0.75rem;
            color: var(--text-light);
        }

        /* ===== MEDIA QUERIES ===== */
        @media (max-width: 768px) {
            .ps5-header {
                flex-direction: column;
                text-align: center;
            }

            .page-title h1 {
                font-size: 1.8rem;
            }

            .page-title span {
                font-size: 0.8rem;
            }

            .stats-badge {
                width: 100%;
                justify-content: center;
            }

            .games-grid {
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
                gap: 1.5rem;
            }

            .game-card {
                max-width: 100%;
            }

            .modal-header {
                grid-template-columns: 1fr;
                gap: 1rem;
                padding: 1.5rem;
            }

            .modal-title {
                font-size: 1.5rem;
            }

            .modal-body,
            .modal-actions {
                padding: 1.5rem;
            }

            .cola-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .card-buttons {
                flex-direction: column;
                gap: 0.6rem;
            }

            .btn-detail,
            .btn-cola {
                width: 100%;
            }

            .modal-actions {
                flex-direction: column;
            }

            .modal-btn {
                width: 100%;
            }
        }

        /* ===== PARTICLE: RAYS OF LIGHT (Grouped beams + trails) with presets/intensity ===== */
        (function setupBackgroundAndCelebration(){
            const canvas = document.getElementById('bg-canvas');
            if(!canvas) return;
            const ctx = canvas.getContext('2d');
            let DPR = window.devicePixelRatio || 1;
            let clusters = [];
            let bursts = [];
            const CSS = getComputedStyle(document.documentElement);

            const PRESETS = {
                mix: [
                    (CSS.getPropertyValue('--accent-1') || '#2563EB').trim(),
                    (CSS.getPropertyValue('--accent-2') || '#A855F7').trim(),
                    (CSS.getPropertyValue('--accent-3') || '#06B6D4').trim(),
                    '#FF4D6A',
                    '#FFD166'
                ],
                blue: ['#1e3a8a', '#2563EB', '#60A5FA', '#93C5FD'],
                gold: ['#FFD166', '#FFB703', '#F59E0B', '#FFE8A1']
            };

            let COLORS = PRESETS.mix.slice();

            const BG_SETTINGS = {
                preset: localStorage.getItem('ps5pro_bg_preset') || 'mix',
                intensity: parseInt(localStorage.getItem('ps5pro_bg_intensity') || '60', 10)
            };

            function applyPreset(preset){
                COLORS = (PRESETS[preset] || PRESETS.mix).slice();
                BG_SETTINGS.preset = preset;
                localStorage.setItem('ps5pro_bg_preset', preset);
            }

            function applyIntensity(val){
                BG_SETTINGS.intensity = Math.max(0, Math.min(100, parseInt(val, 10) || 60));
                localStorage.setItem('ps5pro_bg_intensity', String(BG_SETTINGS.intensity));
            }

            let W = window.innerWidth, H = window.innerHeight;
            function resize(){
                W = window.innerWidth; H = window.innerHeight;
                canvas.width = Math.floor(W * DPR);
                canvas.height = Math.floor(H * DPR);
                canvas.style.width = W + 'px';
                canvas.style.height = H + 'px';
                ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
            }

            function rand(min, max){ return Math.random() * (max - min) + min; }

            function hexWithAlpha(hex, a){
                hex = (hex || '#fff').replace('#','').trim();
                if(hex.length===3) hex = hex.split('').map(x=>x+x).join('');
                const r = parseInt(hex.substr(0,2),16)||255;
                const g = parseInt(hex.substr(2,2),16)||255;
                const b = parseInt(hex.substr(4,2),16)||255;
                return `rgba(${r},${g},${b},${a})`;
            }

            function createClusters(){
                clusters = [];
                const intensityFactor = BG_SETTINGS.intensity / 100;
                const target = Math.max(4, Math.floor((W / 220) * (0.6 + 1.6 * intensityFactor)));
                for(let i=0;i<target;i++){
                    const cx = rand(0.06*W, 0.94*W);
                    const cy = rand(0.06*H, 0.94*H);
                    const color = COLORS[Math.floor(Math.random()*COLORS.length)];
                    const rays = [];
                    const rayCount = Math.floor(rand(3, 5) + Math.floor(8 * intensityFactor));
                    for(let r=0;r<rayCount;r++){
                        rays.push({
                            ox: rand(-80, 80),
                            oy: rand(-60, 60),
                            angle: rand(-0.9, 0.9),
                            baseLength: rand(Math.max(120, W*0.06), Math.max(220, W*0.26)),
                            lenVar: rand(0.08, 0.5),
                            thickness: rand(1.4, 6) * (0.6 + 0.8 * intensityFactor),
                            driftX: rand(-0.02, 0.02),
                            driftY: rand(-0.02, 0.02),
                            pulse: rand(0.006, 0.02),
                            phase: rand(0, Math.PI*2),
                            color
                        });
                    }
                    clusters.push({ x: cx, y: cy, vx: rand(-0.03,0.03)*(0.6+0.8*intensityFactor), vy: rand(-0.02,0.02)*(0.6+0.8*intensityFactor), rays, color });
                }
            }

            function createBurst(x, y, color, amount = 20){
                for(let i=0;i<amount;i++){
                    bursts.push({
                        x, y,
                        vx: Math.cos(rand(0, Math.PI*2)) * rand(0.6, 4.5),
                        vy: Math.sin(rand(0, Math.PI*2)) * rand(0.6, 4.5),
                        life: rand(300, 1200),
                        age: 0,
                        length: rand(80, 420),
                        thickness: rand(1, 4),
                        color
                    });
                }
            }

            let lastTime = performance.now();
            function draw(now){
                const dt = now - lastTime; lastTime = now;
                const intensityFactor = BG_SETTINGS.intensity / 100;

                // Fade previous frames slightly to create smooth trails; fade less when intensity is higher
                ctx.globalCompositeOperation = 'source-over';
                const fadeAlpha = Math.max(0.04, 0.12 - intensityFactor * 0.06);
                ctx.fillStyle = `rgba(5,6,10,${fadeAlpha})`;
                ctx.fillRect(0,0,W, H);

                ctx.globalCompositeOperation = 'lighter';

                // Draw cluster glows and rays
                for(const c of clusters){
                    c.x += c.vx * (dt*0.06);
                    c.y += c.vy * (dt*0.06);
                    if(c.x < -200) c.x = W + 200;
                    if(c.x > W + 200) c.x = -200;
                    if(c.y < -200) c.y = H + 200;
                    if(c.y > H + 200) c.y = -200;

                    const glowRadius = 220 + 180 * intensityFactor;
                    const g = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, glowRadius);
                    g.addColorStop(0, hexWithAlpha(c.color, 0.18 * (0.6 + intensityFactor * 0.8)));
                    g.addColorStop(0.25, hexWithAlpha(c.color, 0.06 * (0.6 + intensityFactor * 0.8)));
                    g.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = g;
                    ctx.beginPath();
                    ctx.arc(c.x, c.y, glowRadius, 0, Math.PI*2);
                    ctx.fill();

                    for(const r of c.rays){
                        r.phase += r.pulse * dt;
                        const pulse = (1 + Math.sin(r.phase)) * 0.5;
                        const len = r.baseLength * (1 - r.lenVar * pulse);
                        const thickness = r.thickness * (0.8 + 0.6 * pulse) * (0.8 + intensityFactor * 1.2);

                        const ox = c.x + r.ox + Math.sin(now/1200 + r.phase) * 6;
                        const oy = c.y + r.oy + Math.cos(now/900 + r.phase) * 4;
                        const ang = r.angle + Math.sin(now/1800 + r.phase) * 0.02;

                        ctx.save();
                        ctx.translate(ox, oy);
                        ctx.rotate(ang);

                        const lg = ctx.createLinearGradient(0, 0, len, 0);
                        lg.addColorStop(0, 'rgba(0,0,0,0)');
                        lg.addColorStop(0.02, hexWithAlpha(r.color, 0.96 * (0.5 + intensityFactor * 0.6)));
                        lg.addColorStop(0.16, hexWithAlpha(r.color, 0.4 * (0.5 + intensityFactor * 0.6)));
                        lg.addColorStop(1, 'rgba(0,0,0,0)');

                        ctx.fillStyle = lg;
                        ctx.shadowBlur = Math.max(6, thickness * 3.5);
                        ctx.shadowColor = hexWithAlpha(r.color, 0.9 * (0.6 + intensityFactor * 0.6));
                        ctx.fillRect(0, -thickness/2, len, thickness);

                        ctx.shadowBlur = 0;
                        ctx.fillStyle = hexWithAlpha(r.color, 0.98 * (0.6 + intensityFactor * 0.7));
                        ctx.fillRect(0, -Math.max(0.8, thickness/6), len * 0.88, Math.max(1, thickness/5));
                        ctx.restore();
                    }
                }

                // bursts (short-lived fast rays)
                for(let i = bursts.length - 1; i >= 0; i--){
                    const b = bursts[i];
                    b.age += dt;
                    if(b.age >= b.life){ bursts.splice(i,1); continue; }
                    const t = 1 - b.age / b.life;
                    const len = b.length * (0.4 + t*0.6);
                    ctx.save();
                    ctx.translate(b.x, b.y);
                    const ang = Math.atan2(b.vy, b.vx);
                    ctx.rotate(ang);
                    const lg = ctx.createLinearGradient(0, 0, len, 0);
                    lg.addColorStop(0, hexWithAlpha(b.color, 0.95 * t * (0.6 + intensityFactor * 0.6)));
                    lg.addColorStop(0.4, hexWithAlpha(b.color, 0.45 * t * (0.6 + intensityFactor * 0.6)));
                    lg.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = lg;
                    ctx.shadowBlur = Math.max(4, b.thickness * 6 * (0.8 + intensityFactor));
                    ctx.shadowColor = hexWithAlpha(b.color, 0.9 * t);
                    ctx.fillRect(0, -b.thickness/2, len, b.thickness);
                    ctx.restore();

                    b.x += b.vx * (dt*0.6);
                    b.y += b.vy * (dt*0.6);
                }

                requestAnimationFrame(draw);
            }

            // Celebration banner
            const celebration = document.createElement('div');
            celebration.id = 'celebration';
            celebration.className = 'celebration';
            celebration.setAttribute('aria-hidden','true');
            celebration.innerHTML = `<i class="fas fa-star"></i><span>¡Felicidades! Good Master Piece</span>`;
            document.body.appendChild(celebration);

            function showCelebration(msg = '¡Felicidades! Good Master Piece'){
                celebration.querySelector('span').textContent = msg;
                celebration.classList.add('show');
                celebration.setAttribute('aria-hidden','false');
                createBurst(W/2 + rand(-120,120), H/2 + rand(-80,80), COLORS[Math.floor(Math.random()*COLORS.length)], 32);
                setTimeout(()=>{ celebration.classList.remove('show'); celebration.setAttribute('aria-hidden','true'); }, 3600);
            }

            // UI controls hookup
            const presetSel = document.getElementById('bg-preset-select');
            const intensityRange = document.getElementById('bg-intensity');

            if(presetSel){
                presetSel.value = BG_SETTINGS.preset;
                presetSel.addEventListener('change', (e)=>{
                    applyPreset(e.target.value);
                    createClusters();
                    createBurst(W * rand(0.35,0.65), H * rand(0.35,0.65), COLORS[Math.floor(Math.random()*COLORS.length)], 26);
                });
            }

            if(intensityRange){
                intensityRange.value = BG_SETTINGS.intensity;
                let to;
                intensityRange.addEventListener('input', (e)=>{
                    const v = parseInt(e.target.value, 10);
                    applyIntensity(v);
                    clearTimeout(to);
                    to = setTimeout(()=>{ createClusters(); createBurst(W/2 + rand(-80,80), H/2 + rand(-60,60), COLORS[Math.floor(Math.random()*COLORS.length)], 18); }, 140);
                });
            }

            // initial setup
            window.addEventListener('resize', () => { DPR = window.devicePixelRatio || 1; resize(); createClusters(); });
            resize(); applyPreset(BG_SETTINGS.preset); createClusters(); requestAnimationFrame((t)=>{ lastTime = t; draw(t); });

            // show once on load with burst
            setTimeout(()=> showCelebration(), 900);
        })();

        // ===== PERSISTENCE (IndexedDB) & AUTO ENGINE =====
        const IDB_NAME = 'ps5pro-db';
        function openIDB() {
            return new Promise((resolve, reject) => {
                const r = indexedDB.open(IDB_NAME, 1);
                r.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv', { keyPath: 'key' });
                };
                r.onsuccess = (e) => resolve(e.target.result);
                r.onerror = (e) => reject(e.target.error);
            });
        }

        async function idbSet(key, value) {
            try {
                const db = await openIDB();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction('kv', 'readwrite');
                    tx.objectStore('kv').put({ key, value });
                    tx.oncomplete = () => resolve(true);
                    tx.onerror = () => reject(tx.error);
                });
            } catch (e) { return Promise.reject(e); }
        }

        async function idbGet(key) {
            try {
                const db = await openIDB();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction('kv', 'readonly');
                    const req = tx.objectStore('kv').get(key);
                    req.onsuccess = () => resolve(req.result ? req.result.value : undefined);
                    req.onerror = () => reject(req.error);
                });
            } catch (e) { return undefined; }
        }

        // Auto engine: adjust intensity/preset according to recent FPS and heuristics
        let __autoRunning = false;
        let __autoRAF = 0;
        let __frameTS = [];
        function startAutoEngine(){
            if(__autoRunning) return;
            __autoRunning = true;
            __frameTS = [];
            const intensityRange = document.getElementById('bg-intensity');
            const presetSel = document.getElementById('bg-preset-select');
            if(!intensityRange || !presetSel) return;
            function tick(ts){
                __frameTS.push(ts);
                if(__frameTS.length>40) __frameTS.shift();
                if(__frameTS.length>2){
                    let sum=0;
                    for(let i=1;i<__frameTS.length;i++) sum += (__frameTS[i]-__frameTS[i-1]);
                    const avg = sum/(__frameTS.length-1);
                    const fps = 1000/Math.max(1, avg);
                    let cur = parseInt(intensityRange.value,10)||60;
                    if(navigator.deviceMemory && navigator.deviceMemory <= 2) {
                        cur = Math.max(12, Math.min(cur, 60));
                    }
                    if(fps < 35) cur = Math.max(8, cur - 8);
                    else if(fps < 50) cur = Math.max(12, cur - 4);
                    else if(fps > 65) cur = Math.min(100, cur + 4);
                    const h = new Date().getHours();
                    if(h >= 20 || h <= 5) {
                        if(presetSel.value !== 'mix') { presetSel.value = 'mix'; presetSel.dispatchEvent(new Event('change')); }
                    } else {
                        if(presetSel.value !== 'blue') { presetSel.value = 'blue'; presetSel.dispatchEvent(new Event('change')); }
                    }
                    if(cur !== (parseInt(intensityRange.value,10)||60)){
                        intensityRange.value = String(cur);
                        intensityRange.dispatchEvent(new Event('input'));
                    }
                    localStorage.setItem('ps5pro_bg_auto','1');
                    localStorage.setItem('ps5pro_bg_intensity', String(cur));
                    try { idbSet('settings', { preset: presetSel.value, intensity: cur, auto: true }).catch(()=>{}); } catch(e){}
                }
                if(__autoRunning) __autoRAF = requestAnimationFrame(tick);
            }
            __autoRAF = requestAnimationFrame(tick);
        }
        function stopAutoEngine(){
            __autoRunning = false;
            cancelAnimationFrame(__autoRAF);
            localStorage.setItem('ps5pro_bg_auto','0');
            try { idbSet('settings', { auto: false }).catch(()=>{}); } catch(e){}
        }

        const __autoBtn = document.getElementById('bg-auto-toggle');
        if(__autoBtn){
            __autoBtn.addEventListener('click', ()=>{
                const active = __autoBtn.classList.toggle('active');
                __autoBtn.setAttribute('aria-pressed', active ? 'true' : 'false');
                if(active){ localStorage.setItem('ps5pro_bg_auto','1'); startAutoEngine(); mostrarToast('Modo Auto activado', 'info', 1600); }
                else { localStorage.setItem('ps5pro_bg_auto','0'); stopAutoEngine(); mostrarToast('Modo Auto desactivado', 'info', 1200); }
            });
            if(localStorage.getItem('ps5pro_bg_auto') === '1'){ __autoBtn.classList.add('active'); __autoBtn.setAttribute('aria-pressed','true'); startAutoEngine(); }
        }

        // ===== FUNCIONES =====
        function mostrarToast(mensaje, tipo = 'info', duracion = 3000, actionLabel = '', actionCallback = null) {
            // tipo: 'success' | 'info' | 'warn'
            toast.className = 'toast';
            toast.classList.add(tipo);
            const iconMap = { success: 'fa-check-circle', info: 'fa-info-circle', warn: 'fa-exclamation-triangle' };
            const icon = iconMap[tipo] || iconMap.info;

            toast.innerHTML = `
                <div class="toast-inner">
                    <i class="toast-icon fas ${icon}"></i>
                    <div class="toast-message">${mensaje}</div>
                    <button class="toast-action" style="display:none;"></button>
                    <div class="toast-progress" role="progressbar" aria-hidden="true"></div>
                </div>
            `;

            const actionBtn = toast.querySelector('.toast-action');
            if (actionLabel) {
                actionBtn.textContent = actionLabel;
                actionBtn.style.display = 'inline-flex';
                actionBtn.onclick = () => {
                    if (typeof actionCallback === 'function') actionCallback();
                    hide();
                };
            }

            const progress = toast.querySelector('.toast-progress');
            let start = Date.now();
            toast.classList.add('show');
            clearTimeout(toast._timeout);
            cancelAnimationFrame(toast._raf || 0);

            function update() {
                const elapsed = Date.now() - start;
                const pct = Math.min(100, (elapsed / duracion) * 100);
                progress.style.width = pct + '%';
                if (pct < 100) toast._raf = requestAnimationFrame(update);
            }

            function hide() {
                cancelAnimationFrame(toast._raf || 0);
                toast.classList.remove('show');
                clearTimeout(toast._timeout);
            }

            toast._raf = requestAnimationFrame(update);
            toast._timeout = setTimeout(() => hide(), duracion);
        }

        function estaEnCola(index) {
            return colaDescarga.includes(index);
        }

        function agregarACola(index) {
            if (!estaEnCola(index)) {
                colaDescarga.push(index);
                localStorage.setItem('ps5pro_cola_descarga', JSON.stringify(colaDescarga));
                try { idbSet('queue', colaDescarga).catch(()=>{}); } catch(e){}
                actualizarContadores();
                renderizarColeccion();
                renderizarCola();
                mostrarToast(`${juegosFiltrados[index].titulo} agregado a la cola`, 'success', 3000);
            }
        }

        function quitarDeCola(index) {
            colaDescarga = colaDescarga.filter(i => i !== index);
            localStorage.setItem('ps5pro_cola_descarga', JSON.stringify(colaDescarga));
            try { idbSet('queue', colaDescarga).catch(()=>{}); } catch(e){}
            actualizarContadores();
            renderizarColeccion();
            renderizarCola();
            mostrarToast(`${juegosFiltrados[index] ? juegosFiltrados[index].titulo + ' quitado de la cola' : 'Quitado de la cola'}`, 'warn', 2600);
        }

        function vaciarCola() {
            if (colaDescarga.length === 0) return;
            if (confirm('¿Vaciar toda la cola de descarga?')) {
                colaDescarga = [];
                localStorage.setItem('ps5pro_cola_descarga', JSON.stringify(colaDescarga));
                try { idbSet('queue', colaDescarga).catch(()=>{}); } catch(e){}
                actualizarContadores();
                renderizarColeccion();
                renderizarCola();
                mostrarToast('Cola vaciada', 'info', 2600);
            }
        }

        function actualizarContadores() {
            contadorSpan.textContent = juegosFiltrados.length;
            colaContador.textContent = colaDescarga.length;
        }

        // ===== TARJETAS =====
        function crearTarjetaColeccion(juego, index) {
            const card = document.createElement('div');
            card.className = 'game-card';
            const enCola = estaEnCola(index);

            const imgTag = `<img class="game-cover" src="${juego.caratula}" alt="${juego.titulo}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">`;
            const fallbackDiv = `<div class="game-cover-fallback" style="display:none;"><i class=\"fas fa-gamepad\"></i></div>`;

            card.innerHTML = `
                ${imgTag}
                ${fallbackDiv}
                <div class="game-info">
                    <h3 class="game-title">${juego.titulo}</h3>
                    <div class="game-meta">
                        <span class="platform-badge"><i class="fas fa-gamepad"></i> PS5 PRO</span>
                        <span class="peso-badge"><i class="fas fa-hdd"></i> ${juego.peso || '?? GB'}</span>
                    </div>
                    <div class="card-buttons">
                        <button class="btn-detail" data-index="${index}"><i class="fas fa-info-circle"></i> Detalles</button>
                        <button class="btn-cola ${enCola ? 'in-cola' : ''}" data-index="${index}" ${enCola ? 'disabled' : ''}>
                            ${enCola ? '<i class="fas fa-check-circle"></i> En cola' : '<i class="fas fa-plus"></i> Cola'}
                        </button>
                    </div>
                </div>
            `;

            card.querySelector('.btn-detail').addEventListener('click', () => abrirDetallesJuego(index));
            card.querySelector('.btn-cola').addEventListener('click', () => agregarACola(index));

            return card;
        }

        function renderizarColeccion() {
            contenedor.innerHTML = '';
            juegosFiltrados.forEach((juego, index) => {
                contenedor.appendChild(crearTarjetaColeccion(juego, index));
            });
        }

        // ===== MODAL DETALLES =====
        function abrirDetallesJuego(index) {
            const juego = juegosFiltrados[index];
            if (!juego) return;

            juegoActual = index;
            document.getElementById('modal-poster').src = juego.caratula;
            document.getElementById('modal-juego-titulo').textContent = juego.titulo;

            const badgesContainer = document.getElementById('modal-badges');
            badgesContainer.innerHTML = `
                <span class="modal-badge"><i class="fas fa-gamepad"></i> ${juego.genero}</span>
                <span class="modal-badge"><i class="fas fa-calendar-alt"></i> ${juego.año}</span>
                <span class="modal-badge"><i class="fas fa-hdd"></i> ${juego.peso}</span>
            `;

            document.getElementById('modal-sinopsis').textContent = juego.sinopsis || 'Sin descripción';

            const specsContainer = document.getElementById('modal-specs');
            specsContainer.innerHTML = `
                <div class="detail-section">
                    <p class="detail-label"><i class="fas fa-building"></i> Desarrollador</p>
                    <p class="detail-content">${juego.desarrollador}</p>
                </div>
                <div class="detail-section">
                    <p class="detail-label"><i class="fas fa-sliders-h"></i> Especificaciones</p>
                    <p class="detail-content">
                        <strong>Género:</strong> ${juego.genero}<br>
                        <strong>Peso:</strong> ${juego.peso}<br>
                        <strong>Año:</strong> ${juego.año}<br>
                        <strong>Plataforma:</strong> PlayStation 5 PRO
                    </p>
                </div>
            `;

            const btnTrailer = document.getElementById('modal-ver-trailer');
            const btnDescargar = document.getElementById('modal-descargar');
            const btnCola = document.getElementById('modal-agregar-cola');

            btnTrailer.style.display = juego.trailer ? 'flex' : 'none';
            btnTrailer.onclick = () => abrirTrailer(juego.trailer);

            btnDescargar.style.display = juego.descarga ? 'flex' : 'none';
            btnDescargar.onclick = () => window.open(juego.descarga, '_blank');

            btnCola.textContent = estaEnCola(index) ? '✓ En la cola' : '➕ Agregar a cola';
            btnCola.disabled = estaEnCola(index);
            btnCola.onclick = () => {
                agregarACola(index);
                cerrarModal('modal-details');
            };

            modalDetails.classList.add('active');
        }

        function abrirTrailer(url) {
            if (!url || url.trim() === '') {
                mostrarToast('No hay tráiler disponible', 'warn', 2600);
                return;
            }
            trailerFrame.src = url;
            modalTrailer.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function cerrarModal(modalId) {
            if (modalId === 'modal-details') {
                modalDetails.classList.remove('active');
            } else if (modalId === 'modal-trailer') {
                trailerFrame.src = '';
                modalTrailer.classList.remove('active');
                document.body.style.overflow = '';
            }
        }

        cerrarModalDetails.addEventListener('click', () => cerrarModal('modal-details'));
        cerrarModalTrailer.addEventListener('click', () => cerrarModal('modal-trailer'));

        modalDetails.addEventListener('click', (e) => {
            if (e.target === modalDetails) cerrarModal('modal-details');
        });

        modalTrailer.addEventListener('click', (e) => {
            if (e.target === modalTrailer) cerrarModal('modal-trailer');
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                cerrarModal('modal-details');
                cerrarModal('modal-trailer');
            }
        });

        // ===== COLA =====
        function renderizarCola() {
            colaContainer.innerHTML = '';

            if (colaDescarga.length === 0) {
                colaContainer.innerHTML = '<div class="cola-empty"><i class="fas fa-inbox"></i> Sin juegos en la cola.<br>Presioná <strong><i class="fas fa-plus"></i> Cola</strong> en la colección.</div>';
                return;
            }

            colaDescarga.forEach((index) => {
                const juego = juegosFiltrados[index];
                if (!juego) return;

                const item = document.createElement('div');
                item.className = 'cola-item';

                const imgTag = juego.caratula
                    ? `<img class="cola-cover" src="${juego.caratula}" alt="${juego.titulo}" loading="lazy">`
                    : `<div class="cola-cover" style="display:flex;align-items:center;justify-content:center;"><i class=\"fas fa-gamepad\"></i></div>`;

                const descargaHTML = juego.descarga && juego.descarga.trim() !== ''
                    ? `<a class="descarga-btn" href="${juego.descarga}" target="_blank" rel="noopener"><i class=\"fas fa-download\"></i> Descargar</a>`
                    : `<span class="descarga-btn sin-enlace"><i class=\"fas fa-lock\"></i> Sin enlace</span>`;

                item.innerHTML = `
                    ${imgTag}
                    <div class="cola-info">
                        <h3>${juego.titulo}</h3>
                        <div class="cola-meta">
                            <span><i class=\"fas fa-gamepad\"></i> ${juego.genero}</span>
                            <span><i class=\"fas fa-hdd\"></i> ${juego.peso}</span>
                        </div>
                    </div>
                    ${descargaHTML}
                    <button class="quitar-cola-btn" data-index="${index}"><i class=\"fas fa-times\"></i> Quitar</button>
                `;

                item.querySelector('.quitar-cola-btn').addEventListener('click', () => {
                    quitarDeCola(index);
                });

                colaContainer.appendChild(item);
            });
        }

        // ===== PESTAÑAS =====
        tabButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                const viewName = btn.getAttribute('data-view');
                tabButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                views.forEach(v => v.classList.remove('active'));
                document.getElementById('view-' + viewName).classList.add('active');
                if (viewName === 'cola') renderizarCola();
            });
        });

        document.getElementById('clear-cola-btn').addEventListener('click', vaciarCola);

        // ===== INIT =====
        (async function initApp(){
            try {
                if (typeof idbGet === 'function') {
                    const q = await idbGet('queue');
                    if (Array.isArray(q)) colaDescarga = q;
                    else {
                        const fromLS = JSON.parse(localStorage.getItem('ps5pro_cola_descarga') || '[]');
                        colaDescarga = Array.isArray(fromLS) ? fromLS : [];
                    }
                } else {
                    colaDescarga = JSON.parse(localStorage.getItem('ps5pro_cola_descarga') || '[]');
                }
            } catch(e) {
                colaDescarga = JSON.parse(localStorage.getItem('ps5pro_cola_descarga') || '[]');
            }

            actualizarContadores();
            renderizarColeccion();
            renderizarCola();

            // start Auto engine if persisted
            const autoBtn = document.getElementById('bg-auto-toggle');
            if (autoBtn && localStorage.getItem('ps5pro_bg_auto') === '1') {
                autoBtn.classList.add('active');
                autoBtn.setAttribute('aria-pressed','true');
                try { startAutoEngine(); } catch(e){}
            }
        })();
    </script>
</body>
